name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"

      - name: Sync
        run: uv sync --all-groups --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
