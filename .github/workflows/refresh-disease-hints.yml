name: Refresh disease hints

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync project
        run: uv sync --locked

      - name: Refresh snapshot from GHO
        run: uv run python scripts/refresh_disease_hints.py

      - name: Open PR if snapshot changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(hints): refresh disease_hints.json from GHO"
          title: "chore(hints): refresh disease_hints.json from GHO"
          body: |
            Automated weekly refresh of `src/who_sentinel/data/disease_hints.json`
            against the live WHO GHO `Indicator` catalog.

            Curated overlay is preserved; only `auto_generated` entries change.
          branch: chore/refresh-disease-hints
          add-paths: src/who_sentinel/data/disease_hints.json
          delete-branch: true
